name: ci

on: [push]

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@v5

            - name: Set up node
              uses: actions/setup-node@v6
              with:
                  node-version: lts/Krypton

            - name: Install dependencies
              run: yarn

            # Biome is scoped to the hand-maintained paths listed in .fernignore so that
            # Fern-generated code does not fail the lint job.
            - name: Lint
              run: yarn lint src/wrapper src/index.ts tests/custom examples

            - name: Check formatting
              run: yarn format:check src/wrapper src/index.ts tests/custom examples

    compile:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [18, 20, 22]

        steps:
            - name: Checkout repo
              uses: actions/checkout@v5

            - name: Set up node
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Compile
              run: yarn && yarn build

    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [18, 20, 22]

        steps:
            - name: Checkout repo
              uses: actions/checkout@v5

            - name: Set up node
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Test
              if: matrix.node-version != 18
              run: yarn && yarn test
              env:
                  ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

            # The generated tests/unit/file suite relies on the global File API,
            # which requires Node 20+, so it is excluded on Node 18 (along with
            # the wire project, which the ignore-pattern override would otherwise
            # leak into the unit project). Everything else runs on Node 18 too.
            - name: Test (Node 18, excluding File-API tests)
              if: matrix.node-version == 18
              run: yarn && yarn test --testPathIgnorePatterns "/tests/wire/" "/tests/unit/file/"
              env:
                  ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

    examples:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@v5

            - name: Set up node
              uses: actions/setup-node@v6
              with:
                  node-version: lts/Krypton

            - name: Install dependencies
              run: yarn

            - name: Type-check examples
              run: yarn tsc -p examples

            - name: Smoke-run examples against a mock server
              run: node examples/smoke/run.mjs

    publish:
        needs: [lint, compile, test, examples]
        if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
        runs-on: ubuntu-latest
        environment: npm-publish
        permissions:
            id-token: write
        steps:
            - name: Checkout repo
              uses: actions/checkout@v5
            - name: Set up node
              uses: actions/setup-node@v6
              with:
                  node-version: lts/Krypton
            - name: Install dependencies
              run: yarn install
            - name: Build
              run: yarn build

            - name: Publish to npm
              run: |
                  publish() {
                    npm publish "$@"
                  }
                  if [[ ${GITHUB_REF} == *alpha* ]]; then
                    publish --access public --tag alpha
                  elif [[ ${GITHUB_REF} == *beta* ]]; then
                    publish --access public --tag beta
                  else
                    publish --access public
                  fi
